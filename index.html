<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>TipFlow</title>
    <meta
      name="description"
      content="TipFlow is a responsive tip calculator and bill splitter with live calculations, inline validation, and mobile-friendly interactions."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app-container">
      <section class="workspace">
        <article class="calculator-panel">
          <div class="panel-top">
            <div class="brand">
              <img
                src="assets/favicon.png"
                alt="TipFlow Logo"
                class="brand-logo"
              />
              <div class="brand-copy">
                <h2>TipFlow</h2>
                <p>Split bills without the headache</p>
              </div>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="billAmount">Bill Amount</label>
              <input
                type="number"
                id="billAmount"
                class="input-field"
                placeholder="Rs. 0.00"
                min="0"
                step="0.01"
                inputmode="decimal"
                autocomplete="off"
                required
                aria-describedby="billError"
              />
              <small
                class="error-message"
                id="billError"
                aria-live="polite"
              ></small>
            </div>

            <div class="form-group">
              <label>Tip Percentage</label>
              <div class="tip-buttons">
                <button
                  type="button"
                  class="tip-btn active-tip"
                  data-tip="10"
                  aria-label="Select 10 percent tip"
                >
                  10%
                </button>
                <button
                  type="button"
                  class="tip-btn"
                  data-tip="15"
                  aria-label="Select 15 percent tip"
                >
                  15%
                </button>
                <button
                  type="button"
                  class="tip-btn"
                  data-tip="20"
                  aria-label="Select 20 percent tip"
                >
                  20%
                </button>
                <button
                  type="button"
                  class="tip-btn"
                  data-tip="25"
                  aria-label="Select 25 percent tip"
                >
                  25%
                </button>
              </div>
              <input
                type="number"
                id="customTip"
                class="input-field custom-tip-input"
                placeholder="Custom tip %"
                min="0"
                max="100"
                step="1"
                inputmode="numeric"
                autocomplete="off"
                aria-describedby="tipError"
              />
              <small
                class="error-message"
                id="tipError"
                aria-live="polite"
              ></small>
            </div>

            <div class="form-group">
              <label for="peopleCount">Number of People</label>
              <input
                type="number"
                id="peopleCount"
                class="input-field"
                placeholder="1"
                min="1"
                step="1"
                inputmode="numeric"
                autocomplete="off"
                required
                aria-describedby="peopleError"
              />
              <small
                class="error-message"
                id="peopleError"
                aria-live="polite"
              ></small>
            </div>
          </div>

          <button
            type="button"
            id="resetBtn"
            class="reset-btn"
            aria-label="Reset calculator"
          >
            Reset Calculator
          </button>
        </article>

        <aside class="summary-panel">
          <div class="summary-header">
            <h2>Calculation Summary</h2>
          </div>
          <div class="summary-card">
            <div class="summary-heading">
              <div>
                <span class="summary-title">Per Person</span>
                <strong id="perPerson">Rs. 0.00</strong>
              </div>
              <p>Updated instantly based on your values.</p>
            </div>

            <div class="results-grid">
              <article class="result-item">
                <div>
                  <span>Total Tip</span>
                  <small>Overall tip amount</small>
                </div>
                <strong id="tipAmount">Rs. 0.00</strong>
              </article>

              <article class="result-item">
                <div>
                  <span>Grand Total</span>
                  <small>Bill + tip</small>
                </div>
                <strong id="grandTotal">Rs. 0.00</strong>
              </article>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
