<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>TipFlow</title>

    <meta
      name="description"
      content="TipFlow is a responsive tip calculator and bill splitter with live calculations, inline validation, and mobile-friendly interactions."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Main Application -->
    <main class="app-container">
      <!-- Calculator Card -->
      <section class="tipflow-card">
        <!-- ========================= -->
        <!-- LEFT SIDE / INPUT SECTION -->
        <!-- ========================= -->

        <div class="input-section">
          <!-- Branding -->
          <header class="brand">
            <img src="assets/logo.png" alt="TipFlow Logo" class="brand-logo" />

            <div class="brand-text">
              <h1>TipFlow</h1>
              <p>Smart tip calculation made simple</p>
            </div>
          </header>

          <!-- Bill Amount -->
          <div class="form-group">
            <label for="billAmount"> Bill Amount (Rs.) </label>

            <input
              type="number"
              id="billAmount"
              class="input-field"
              placeholder="Enter bill amount"
              min="0"
              step="0.01"
              inputmode="decimal"
              autocomplete="off"
              required
              aria-describedby="billError"
            />

            <small class="error-message" id="billError" aria-live="polite">
            </small>
          </div>

          <!-- Tip Percentage -->
          <div class="form-group">
            <label> Select Tip Percentage </label>

            <!-- Preset Tip Buttons -->
            <div class="tip-buttons">
              <button
                type="button"
                class="tip-btn active-tip"
                data-tip="10"
                aria-label="Select 10 percent tip"
              >
                10%
              </button>

              <button
                type="button"
                class="tip-btn"
                data-tip="15"
                aria-label="Select 15 percent tip"
              >
                15%
              </button>

              <button
                type="button"
                class="tip-btn"
                data-tip="20"
                aria-label="Select 20 percent tip"
              >
                20%
              </button>

              <button
                type="button"
                class="tip-btn"
                data-tip="25"
                aria-label="Select 25 percent tip"
              >
                25%
              </button>
            </div>

            <!-- Custom Tip Input -->
            <input
              type="number"
              id="customTip"
              class="input-field custom-tip-input"
              placeholder="Custom tip %"
              min="0"
              max="100"
              step="1"
              inputmode="numeric"
              autocomplete="off"
              aria-describedby="tipError"
            />

            <small class="error-message" id="tipError" aria-live="polite">
            </small>
          </div>

          <!-- Number Of People -->
          <div class="form-group">
            <label for="peopleCount"> Number of People </label>

            <input
              type="number"
              id="peopleCount"
              class="input-field"
              placeholder="Enter number of people"
              min="1"
              step="1"
              inputmode="numeric"
              autocomplete="off"
              required
              aria-describedby="peopleError"
            />

            <small class="error-message" id="peopleError" aria-live="polite">
            </small>
          </div>

          <!-- Reset Button -->
          <button
            type="button"
            id="resetBtn"
            class="reset-btn"
            aria-label="Reset calculator"
          >
            Reset Calculator
          </button>
        </div>

        <!-- ========================== -->
        <!-- RIGHT SIDE / RESULT PANEL -->
        <!-- ========================== -->

        <aside class="results-section">
          <h2>Calculation Summary</h2>

          <div class="result-card">
            <!-- Total Tip -->
            <div class="result-item">
              <div class="result-label">
                <span>Total Tip</span>
                <small>Overall tip amount</small>
              </div>

              <h3 id="tipAmount">Rs. 0.00</h3>
            </div>

            <!-- Grand Total -->
            <div class="result-item">
              <div class="result-label">
                <span>Grand Total</span>
                <small>Bill + tip</small>
              </div>

              <h3 id="grandTotal">Rs. 0.00</h3>
            </div>

            <!-- Per Person -->
            <div class="result-item">
              <div class="result-label">
                <span>Per Person</span>
                <small>Split equally</small>
              </div>

              <h3 id="perPerson">Rs. 0.00</h3>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
